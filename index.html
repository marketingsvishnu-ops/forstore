<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cricket Swipe Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #071b0b;
}

/* ================= GAME ================= */

.game {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 420px;
    overflow: hidden;
    background: #39a83d;
    touch-action: none;
}

/* ================= SKY ================= */

.sky {
    position: absolute;
    inset: 0 0 55% 0;
    background: linear-gradient(
        #4da9dc 0%,
        #8ed0ef 60%,
        #bde8f7 100%
    );
}

/* ================= STADIUM ================= */

.stadium {
    position: absolute;
    top: 8%;
    left: 0;
    width: 100%;
    height: 42%;
    overflow: hidden;
}

.roof {
    position: absolute;
    top: 0;
    left: 4%;
    width: 92%;
    height: 45%;
    border-radius: 50% 50% 0 0;
    background: #263238;
    border-bottom: 15px solid #4c6b70;
    opacity: .95;
}

.stands {
    position: absolute;
    left: 2%;
    right: 2%;
    bottom: 5%;
    height: 75%;
    border-radius: 35% 35% 5% 5%;
    background:
        repeating-linear-gradient(
            90deg,
            #243b40 0 15px,
            #607d82 15px 22px,
            #344f53 22px 35px
        );
    box-shadow:
        inset 0 -20px 0 #17343a,
        0 10px 20px rgba(0,0,0,.25);
}

.crowd {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 16%;
    height: 25%;
    background:
        radial-gradient(circle, #f6e75b 0 3px, transparent 4px),
        radial-gradient(circle, #ef5350 0 3px, transparent 4px),
        radial-gradient(circle, #42a5f5 0 3px, transparent 4px),
        radial-gradient(circle, #ffffff 0 3px, transparent 4px);
    background-size: 25px 18px, 31px 20px, 22px 17px, 29px 19px;
    opacity: .9;
}

.advert {
    position: absolute;
    bottom: 8%;
    left: 5%;
    right: 5%;
    height: 35px;
    background: #e9c229;
    border: 4px solid #f5e46c;
    color: #15251a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(10px, 2vw, 17px);
    font-weight: 900;
    letter-spacing: 2px;
}

/* ================= FIELD ================= */

.field {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: -30%;
    height: 75%;
    border-radius: 50% 50% 0 0;
    background:
        radial-gradient(
            ellipse at center,
            #78c850 0%,
            #3da73d 48%,
            #25852f 100%
        );
    transform: perspective(600px) rotateX(12deg);
    transform-origin: bottom;
}

.field-lines {
    position: absolute;
    left: 50%;
    top: 15%;
    width: 55%;
    height: 70%;
    transform: translateX(-50%);
    border-left: 2px solid rgba(255,255,255,.18);
    border-right: 2px solid rgba(255,255,255,.18);
    border-radius: 50%;
}

/* ================= PITCH ================= */

.pitch {
    position: absolute;
    z-index: 3;
    left: 50%;
    bottom: -5%;
    width: min(34vw, 360px);
    height: 73%;
    transform: translateX(-50%);
    background:
        linear-gradient(
            90deg,
            #bd9360,
            #e0b67b 15%,
            #d3a66b 50%,
            #e2b879 85%,
            #b98d5b
        );
    clip-path: polygon(25% 0,75% 0,100% 100%,0 100%);
    box-shadow: inset 0 0 30px rgba(80,45,15,.3);
}

/* pitch grass lines */

.pitch::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(120,80,40,.15);
}

/* ================= CREASE ================= */

.crease {
    position: absolute;
    z-index: 5;
    left: 50%;
    bottom: 12%;
    width: min(24vw, 270px);
    height: 70px;
    transform: translateX(-50%);
    border: 5px solid white;
    border-bottom: 0;
}

.crease.back {
    bottom: 37%;
    transform: translateX(-50%) scale(.72);
}

/* ================= STUMPS ================= */

.stumps {
    position: absolute;
    z-index: 8;
    left: 50%;
    bottom: 9%;
    width: 75px;
    height: 105px;
    transform: translateX(-50%);
}

.stump {
    position: absolute;
    bottom: 0;
    width: 7px;
    height: 92px;
    background: linear-gradient(90deg,#1976d2,#65b5ff,#1261a8);
    border-radius: 3px;
    box-shadow: 1px 0 2px rgba(0,0,0,.4);
}

.stump:nth-child(1) { left: 5px; }
.stump:nth-child(2) { left: 34px; }
.stump:nth-child(3) { right: 5px; }

.bail {
    position: absolute;
    top: 5px;
    width: 35px;
    height: 6px;
    background: #f7d33b;
    border-radius: 4px;
}

.bail.left { left: 2px; }
.bail.right { right: 2px; }

/* ================= BOWLER ================= */

.bowler {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 29%;
    transform: translateX(-50%);
    font-size: clamp(34px, 6vw, 58px);
    transition: transform .2s;
}

.bowler.runup {
    animation: runup .45s ease-out;
}

@keyframes runup {
    0% { transform: translateX(-50%) translateY(-25px); }
    100% { transform: translateX(-50%) translateY(0); }
}

/* ================= BATSMAN ================= */

.batsman {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: 13%;
    width: 130px;
    height: 190px;
    transform: translateX(-50%);
    transition: transform .15s;
}

/* head */

.head {
    position: absolute;
    left: 49px;
    top: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #8d5524;
    border: 6px solid #1473b9;
    box-shadow: 0 0 0 3px #0b4d7d;
}

/* helmet grill */

.head::after {
    content: "";
    position: absolute;
    left: -8px;
    top: 20px;
    width: 50px;
    height: 18px;
    border-bottom: 3px solid #d7e2e8;
    border-left: 3px solid #d7e2e8;
    border-right: 3px solid #d7e2e8;
    border-radius: 0 0 20px 20px;
}

/* body */

.body {
    position: absolute;
    left: 38px;
    top: 38px;
    width: 58px;
    height: 82px;
    border-radius: 15px 15px 10px 10px;
    background: linear-gradient(
        90deg,
        #075a96,
        #1594db,
        #075a96
    );
    border: 3px solid #063e67;
}

/* shirt number */

.body::after {
    content: "13";
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    color: white;
    font-size: 23px;
    font-weight: 900;
}

/* arms */

.arm {
    position: absolute;
    top: 48px;
    width: 17px;
    height: 72px;
    background: #8d5524;
    border-radius: 15px;
    transform-origin: top;
}

.arm.left {
    left: 29px;
    transform: rotate(35deg);
}

.arm.right {
    right: 24px;
    transform: rotate(-42deg);
}

/* legs */

.leg {
    position: absolute;
    top: 110px;
    width: 22px;
    height: 72px;
    background: #168bd0;
    border-radius: 10px;
    transform-origin: top;
}

.leg.left {
    left: 40px;
    transform: rotate(12deg);
}

.leg.right {
    right: 40px;
    transform: rotate(-12deg);
}

/* shoes */

.shoe {
    position: absolute;
    bottom: 0;
    width: 35px;
    height: 15px;
    background: white;
    border-radius: 12px;
}

.shoe.left { left: 25px; }
.shoe.right { right: 25px; }

/* bat */

.bat {
    position: absolute;
    z-index: 4;
    right: 2px;
    top: 45px;
    width: 20px;
    height: 115px;
    background: linear-gradient(
        90deg,
        #8d572f,
        #d8a05c,
        #7b4827
    );
    border-radius: 7px 7px 3px 3px;
    transform: rotate(35deg);
    transform-origin: bottom center;
    box-shadow: 2px 2px 4px rgba(0,0,0,.4);
}

/* batting animation */

.batsman.swing {
    animation: playerSwing .55s ease-out;
}

.batsman.swing .bat {
    animation: batSwing .55s ease-out;
}

@keyframes playerSwing {
    0% { transform: translateX(-50%) rotate(0); }
    45% { transform: translateX(-50%) rotate(-7deg); }
    100% { transform: translateX(-50%) rotate(4deg); }
}

@keyframes batSwing {
    0% { transform: rotate(35deg); }
    35% { transform: rotate(-70deg); }
    65% { transform: rotate(-5deg); }
    100% { transform: rotate(45deg); }
}

/* ================= BALL ================= */

.ball {
    position: absolute;
    z-index: 20;
    left: 50%;
    top: 34%;
    width: 17px;
    height: 17px;
    margin-left: -8px;
    border-radius: 50%;
    background: #c62828;
    border: 2px solid #9e1b1b;
    box-shadow: 0 0 8px rgba(0,0,0,.5);
    opacity: 0;
}

.ball.bowling {
    opacity: 1;
    animation: bowl .7s linear forwards;
}

@keyframes bowl {
    0% {
        top: 30%;
        left: 50%;
        transform: scale(.55);
    }

    70% {
        top: 49%;
        left: 50%;
        transform: scale(.8);
    }

    100% {
        top: 63%;
        left: 50%;
        transform: scale(1);
    }
}

/* hit directions */

.ball.hit-left {
    animation: hitLeft .8s ease-out forwards;
}

.ball.hit-right {
    animation: hitRight .8s ease-out forwards;
}

.ball.hit-up {
    animation: hitUp .95s ease-out forwards;
}

.ball.hit-down {
    animation: hitDown .5s ease-out forwards;
}

@keyframes hitLeft {
    to {
        left: 8%;
        top: 20%;
        transform: scale(1.2);
    }
}

@keyframes hitRight {
    to {
        left: 92%;
        top: 22%;
        transform: scale(1.3);
    }
}

@keyframes hitUp {
    to {
        left: 50%;
        top: 3%;
        transform: scale(1.5);
    }
}

@keyframes hitDown {
    to {
        left: 50%;
        top: 75%;
    }
}

/* ================= SCORE HUD ================= */

.hud {
    position: absolute;
    z-index: 50;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: min(95%, 720px);
    height: 76px;
    background: rgba(10,25,30,.94);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    border: 2px solid rgba(255,255,255,.25);
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

.team {
    text-align: center;
    min-width: 100px;
}

.team small {
    display: block;
    color: #b7c4c9;
    font-size: 11px;
}

.team strong {
    font-size: 20px;
}

.score-box {
    text-align: center;
}

.score-box .score {
    font-size: 30px;
    font-weight: 900;
}

.score-box small {
    color: #ffd83d;
}

/* ================= MESSAGE ================= */

.message {
    position: absolute;
    z-index: 60;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,.65);
    color: white;
    font-size: clamp(15px, 3vw, 22px);
    font-weight: bold;
    white-space: nowrap;
}

/* ================= SWIPE HINT ================= */

.swipe-hint {
    position: absolute;
    z-index: 55;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    border-radius: 30px;
    background: rgba(0,0,0,.65);
    color: white;
    font-weight: bold;
    font-size: clamp(12px, 2.5vw, 17px);
    text-align: center;
}

.swipe-hint span {
    color: #ffd83d;
}

/* ================= RESTART ================= */

.restart {
    position: absolute;
    z-index: 70;
    top: 105px;
    right: 18px;
    border: 0;
    background: #e53935;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.restart:active {
    transform: scale(.94);
}

/* ================= PC ================= */

@media (min-width: 700px) {
    .game {
        max-width: 1200px;
        margin: auto;
        border-left: 3px solid #111;
        border-right: 3px solid #111;
    }

    .swipe-hint {
        bottom: 18px;
    }
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .game {
        min-height: 100vh;
    }

    .hud {
        height: 64px;
        top: 7px;
    }

    .team {
        min-width: 70px;
    }

    .team strong {
        font-size: 15px;
    }

    .score-box .score {
        font-size: 25px;
    }

    .message {
        top: 80px;
    }

    .restart {
        top: 80px;
        right: 8px;
        padding: 7px 10px;
        font-size: 11px;
    }

    .pitch {
        width: 46vw;
    }

    .batsman {
        transform: translateX(-50%) scale(.82);
        bottom: 12%;
    }

    .batsman.swing {
        animation-name: mobileSwing;
    }

    @keyframes mobileSwing {
        0% { transform: translateX(-50%) scale(.82) rotate(0); }
        50% { transform: translateX(-50%) scale(.82) rotate(-7deg); }
        100% { transform: translateX(-50%) scale(.82) rotate(4deg); }
    }

    .bowler {
        top: 32%;
    }

    .swipe-hint {
        bottom: 10px;
        padding: 9px 15px;
    }
}
</style>
</head>

<body>

<div class="game" id="game">

    <!-- SKY -->
    <div class="sky"></div>

    <!-- STADIUM -->
    <div class="stadium">
        <div class="roof"></div>
        <div class="stands"></div>
        <div class="crowd"></div>
        <div class="advert">
            CRICKET CHAMPIONSHIP
        </div>
    </div>

    <!-- FIELD -->
    <div class="field">
        <div class="field-lines"></div>
    </div>

    <!-- PITCH -->
    <div class="pitch"></div>

    <!-- CREASE -->
    <div class="crease"></div>
    <div class="crease back"></div>

    <!-- STUMPS -->
    <div class="stumps">
        <div class="stump"></div>
        <div class="stump"></div>
        <div class="stump"></div>
        <div class="bail left"></div>
        <div class="bail right"></div>
    </div>

    <!-- BOWLER -->
    <div class="bowler" id="bowler">🏃</div>

    <!-- BALL -->
    <div class="ball" id="ball"></div>

    <!-- BATSMAN -->
    <div class="batsman" id="batsman">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

        <div class="shoe left"></div>
        <div class="shoe right"></div>

        <div class="bat"></div>

    </div>

    <!-- SCORE HUD -->
    <div class="hud">

        <div class="team">
            <small>BATSMAN</small>
            <strong>SUNDER 🇮🇳</strong>
        </div>

        <div class="score-box">
            <small>TOTAL RUNS</small>
            <div class="score">
                <span id="runs">0</span>/<span id="wickets">0</span>
            </div>
        </div>

        <div class="score-box">
            <small>TARGET</small>
            <div class="score">20</div>
        </div>

        <div class="team">
            <small>OVERS</small>
            <strong><span id="balls">0</span>/6</strong>
        </div>

    </div>

    <!-- MESSAGE -->
    <div class="message" id="message">
        🏏 Swipe to play your shot!
    </div>

    <!-- RESTART -->
    <button class="restart" onclick="restartGame()">
        🔄 Restart
    </button>

    <!-- SWIPE INSTRUCTION -->
    <div class="swipe-hint">
        📱 <span>Swipe</span> ← → ↑ ↓ &nbsp; | &nbsp;
        🖥️ Keyboard: ← → ↑ ↓
    </div>

</div>


<script>

const game = document.getElementById("game");
const batsman = document.getElementById("batsman");
const ball = document.getElementById("ball");
const bowler = document.getElementById("bowler");
const message = document.getElementById("message");

const runsText = document.getElementById("runs");
const wicketsText = document.getElementById("wickets");
const ballsText = document.getElementById("balls");

let runs = 0;
let wickets = 0;
let balls = 0;
let waiting = false;
let gameOver = false;

let startX = 0;
let startY = 0;


/* ================================
   START BOWLING
================================ */

function bowlBall() {

    if (gameOver) return;

    waiting = false;

    ball.className = "ball";

    void ball.offsetWidth;

    bowler.classList.remove("runup");
    void bowler.offsetWidth;
    bowler.classList.add("runup");

    ball.classList.add("bowling");

    message.textContent = "🎯 Ball coming... SWIPE!";

    setTimeout(() => {
        if (!waiting && !gameOver) {
            message.textContent = "👆 Swipe now!";
        }
    }, 450);
}


/* ================================
   SWIPE START
================================ */

game.addEventListener("touchstart", function(e) {

    if (gameOver || waiting) return;

    const touch = e.touches[0];

    startX = touch.clientX;
    startY = touch.clientY;

}, { passive: true });


/* ================================
   SWIPE END
================================ */

game.addEventListener("touchend", function(e) {

    if (gameOver || waiting) return;

    const touch = e.changedTouches[0];

    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    const distance = Math.sqrt(
        dx * dx + dy * dy
    );

    if (distance < 35) return;

    let direction;

    if (Math.abs(dx) > Math.abs(dy)) {

        direction = dx > 0 ? "right" : "left";

    } else {

        direction = dy < 0 ? "up" : "down";

    }

    playShot(direction);

}, { passive: true });


/* ================================
   PC MOUSE DRAG
================================ */

game.addEventListener("mousedown", function(e) {

    if (gameOver || waiting) return;

    startX = e.clientX;
    startY = e.clientY;

});

game.addEventListener("mouseup", function(e) {

    if (gameOver || waiting) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    const distance = Math.sqrt(
        dx * dx + dy * dy
    );

    if (distance < 25) return;

    let direction;

    if (Math.abs(dx) > Math.abs(dy)) {
        direction = dx > 0 ? "right" : "left";
    } else {
        direction = dy < 0 ? "up" : "down";
    }

    playShot(direction);

});


/* ================================
   KEYBOARD
================================ */

document.addEventListener("keydown", function(e) {

    if (gameOver || waiting) return;

    let direction = null;

    if (e.key === "ArrowLeft") {
        direction = "left";
    }

    if (e.key === "ArrowRight") {
        direction = "right";
    }

    if (e.key === "ArrowUp") {
        direction = "up";
    }

    if (e.key === "ArrowDown") {
        direction = "down";
    }

    if (direction) {
        e.preventDefault();
        playShot(direction);
    }

    if (
        e.key.toLowerCase() === "r"
    ) {
        restartGame();
    }

});


/* ================================
   PLAY SHOT
================================ */

function playShot(direction) {

    if (waiting || gameOver) return;

    waiting = true;

    /* Bat animation */

    batsman.classList.remove("swing");
    void batsman.offsetWidth;
    batsman.classList.add("swing");


    /* Random outcome */

    const random = Math.random();

    let result;
    let score = 0;

    /*
       Different swipe directions have
       slightly different scoring chances.
    */

    if (direction === "up") {

        if (random < .08) {
            result = "OUT";
        } else if (random < .55) {
            result = "SIX";
            score = 6;
        } else {
            result = "FOUR";
            score = 4;
        }

    } else if (direction === "left") {

        if (random < .10) {
            result = "OUT";
        } else if (random < .50) {
            result = "FOUR";
            score = 4;
        } else if (random < .75) {
            result = "TWO";
            score = 2;
        } else {
            result = "ONE";
            score = 1;
        }

    } else if (direction === "right") {

        if (random < .10) {
            result = "OUT";
        } else if (random < .60) {
            result = "FOUR";
            score = 4;
        } else if (random < .82) {
            result = "TWO";
            score = 2;
        } else {
            result = "ONE";
            score = 1;
        }

    } else {

        if (random < .16) {
            result = "OUT";
        } else if (random < .55) {
            result = "ONE";
            score = 1;
        } else if (random < .80) {
            result = "TWO";
            score = 2;
        } else {
            result = "ZERO";
            score = 0;
        }
    }


    /* Ball animation */

    ball.className = "ball";

    void ball.offsetWidth;

    if (result === "SIX") {
        ball.classList.add("hit-up");
    }
    else if (direction === "left") {
        ball.classList.add("hit-left");
    }
    else if (direction === "right") {
        ball.classList.add("hit-right");
    }
    else {
        ball.classList.add("hit-down");
    }


    setTimeout(() => {

        balls++;

        if (result === "OUT") {

            wickets++;

            message.textContent =
                "💥 OUT! Bowled!";

        } else {

            runs += score;

            if (result === "SIX") {

                message.textContent =
                    "🚀 SIX! What a shot!";

            }
            else if (result === "FOUR") {

                message.textContent =
                    "🔥 FOUR! Beautiful boundary!";

            }
            else if (result === "TWO") {

                message.textContent =
                    "🏃🏃 TWO RUNS!";

            }
            else if (result === "ONE") {

                message.textContent =
                    "🏃 ONE RUN!";

            }
            else {

                message.textContent =
                    "🛡️ Dot ball!";
            }
        }

        updateScore();

        checkGame();

    }, 650);
}


/* ================================
   CHECK GAME
================================ */

function checkGame() {

    if (runs >= 20) {

        gameOver = true;

        message.textContent =
            "🏆 YOU WIN! 20 RUNS REACHED!";

        message.style.background =
            "rgba(15,110,35,.9)";

        return;
    }

    if (wickets >= 2) {

        gameOver = true;

        message.textContent =
            "💀 ALL OUT! " +
            runs + "/" + wickets;

        return;
    }

    if (balls >= 6) {

        gameOver = true;

        if (runs >= 20) {

            message.textContent =
                "🏆 YOU WIN!";

        } else {

            message.textContent =
                "😢 INNINGS OVER! " +
                runs + "/" + wickets;
        }

        return;
    }

    /* Reset ball */

    setTimeout(() => {

        ball.className = "ball";

        bowlBall();

    }, 600);
}


/* ================================
   UPDATE SCORE
================================ */

function updateScore() {

    runsText.textContent = runs;
    wicketsText.textContent = wickets;
    ballsText.textContent = balls;

}


/* ================================
   RESTART
================================ */

function restartGame() {

    runs = 0;
    wickets = 0;
    balls = 0;

    waiting = false;
    gameOver = false;

    message.textContent =
        "🏏 Swipe to play your shot!";

    message.style.background =
        "rgba(0,0,0,.65)";

    batsman.classList.remove("swing");

    ball.className = "ball";

    updateScore();

    setTimeout(() => {
        bowlBall();
    }, 300);
}


/* ================================
   START GAME
================================ */

setTimeout(() => {
    bowlBall();
}, 500);

</script>
